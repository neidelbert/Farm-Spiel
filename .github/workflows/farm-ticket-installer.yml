name: Farm-Spiel Ticket Installer

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "ChatGPT Farm-Spiel payload (FS/TOOLS, schema 2)"
        required: true
        type: string
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: farm-spiel-ticket-installer
  cancel-in-progress: false

jobs:
  install:
    name: Verify, test and install authorized payload
    if: >-
      github.repository == 'neidelbert/Farm-Spiel' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'neidelbert' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'issues' &&
          github.actor == 'neidelbert' &&
          github.event.issue.user.login == 'neidelbert' &&
          github.event.issue.author_association == 'OWNER' &&
          startsWith(github.event.issue.title, '[FARM-TICKET] ')
        )
      )

    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 12

    outputs:
      ticket: ${{ steps.prepare.outputs.ticket }}
      result_sha: ${{ steps.prepare.outputs.result_sha }}
      payload_sha256: ${{ steps.prepare.outputs.payload_sha256 }}
      tests: ${{ steps.prepare.outputs.tests }}

    steps:
      - name: Checkout develop without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Verify payload, apply files, run checks and create commit
        id: prepare
        env:
          FARM_EVENT_NAME: ${{ github.event_name }}
          FARM_ACTOR: ${{ github.actor }}
          FARM_REPOSITORY: ${{ github.repository }}
          FARM_REPOSITORY_OWNER: ${{ github.repository_owner }}
          FARM_MANUAL_PAYLOAD: ${{ inputs.payload }}
          FARM_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          FARM_ISSUE_ASSOCIATION: ${{ github.event.issue.author_association }}
          FARM_ISSUE_TITLE: ${{ github.event.issue.title }}
          FARM_ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          EXPECTED_REPOSITORY = "neidelbert/Farm-Spiel"
          EXPECTED_OWNER = "neidelbert"
          TARGET_BRANCH = "develop"
          PAYLOAD_SCHEMA = 2

          MAX_PAYLOAD_CHARS = 60000
          MAX_JSON_BYTES = 5000000
          MAX_FILES = 50
          MAX_FILE_BYTES = 2000000
          MAX_TOTAL_FILE_BYTES = 5000000
          TEST_TIMEOUT_SECONDS = 180

          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)

          def run(*args, env=None, timeout=120):
              try:
                  result = subprocess.run(
                      args,
                      text=True,
                      capture_output=True,
                      env=env,
                      timeout=timeout,
                  )
              except subprocess.TimeoutExpired:
                  fail(f"Command timed out: {' '.join(args)}")

              if result.returncode != 0:
                  if result.stdout:
                      print(result.stdout)
                  if result.stderr:
                      print(result.stderr, file=sys.stderr)
                  raise SystemExit(result.returncode)

              return result

          event_name = os.environ.get("FARM_EVENT_NAME", "").strip()
          actor = os.environ.get("FARM_ACTOR", "").strip()
          repository = os.environ.get("FARM_REPOSITORY", "").strip()
          repository_owner = os.environ.get("FARM_REPOSITORY_OWNER", "").strip()
          issue_author = os.environ.get("FARM_ISSUE_AUTHOR", "").strip()
          issue_association = os.environ.get("FARM_ISSUE_ASSOCIATION", "").strip()
          issue_title = os.environ.get("FARM_ISSUE_TITLE", "").strip()

          if repository != EXPECTED_REPOSITORY:
              fail("Repository mismatch.")

          if repository_owner != EXPECTED_OWNER:
              fail("Repository owner mismatch.")

          if actor != EXPECTED_OWNER:
              fail("Unauthorized workflow actor.")

          if event_name == "workflow_dispatch":
              payload_text = os.environ.get("FARM_MANUAL_PAYLOAD", "").strip()

          elif event_name == "issues":
              if issue_author != EXPECTED_OWNER:
                  fail("Unauthorized issue author.")

              if issue_association != "OWNER":
                  fail("Unauthorized issue association.")

              if not issue_title.startswith("[FARM-TICKET] "):
                  fail("Issue title does not use the required prefix.")

              issue_body = os.environ.get("FARM_ISSUE_BODY", "")
              match = re.fullmatch(
                  r"\s*PAYLOAD_START\s*\n([A-Za-z0-9_-]+)\s*\nPAYLOAD_END\s*",
                  issue_body,
              )

              if not match:
                  fail("Issue body does not contain one valid payload.")

              payload_text = match.group(1).strip()

          else:
              fail("Unsupported trigger event.")

          if not payload_text:
              fail("Ticket payload is empty.")

          if len(payload_text) > MAX_PAYLOAD_CHARS:
              fail("Ticket payload is too large.")

          if not re.fullmatch(r"[A-Za-z0-9_-]+", payload_text):
              fail("Ticket payload is not valid base64url.")

          payload_sha256 = hashlib.sha256(payload_text.encode("ascii")).hexdigest()
          padded = payload_text + "=" * (-len(payload_text) % 4)

          try:
              compressed = base64.urlsafe_b64decode(padded.encode("ascii"))
              with gzip.GzipFile(fileobj=io.BytesIO(compressed), mode="rb") as gz:
                  raw = gz.read(MAX_JSON_BYTES + 1)

              if len(raw) > MAX_JSON_BYTES:
                  fail("Decoded manifest is too large.")

              manifest = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              fail(f"Could not decode ticket payload: {exc}")

          if manifest.get("schema") != PAYLOAD_SCHEMA:
              fail("Unsupported payload schema.")

          if manifest.get("repository") != EXPECTED_REPOSITORY:
              fail("Payload repository mismatch.")

          if manifest.get("target_branch") != TARGET_BRANCH:
              fail("Payload branch mismatch.")

          ticket = manifest.get("ticket")
          base_sha = manifest.get("base_sha")
          commit_message = manifest.get("commit_message")
          files = manifest.get("files")

          if not isinstance(ticket, str) or not re.fullmatch(r"(?:FS|TOOLS)-\d{3}", ticket):
              fail("Invalid ticket ID.")

          if event_name == "issues":
              expected_title = f"[FARM-TICKET] {ticket}"
              if issue_title != expected_title:
                  fail("Issue title does not match the payload ticket.")

          if not isinstance(base_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", base_sha):
              fail("Invalid base SHA.")

          if (
              not isinstance(commit_message, str)
              or not re.fullmatch(rf"{re.escape(ticket)}: [^\r\n]{{1,120}}", commit_message)
          ):
              fail("Invalid commit message.")

          if not isinstance(files, list) or not (1 <= len(files) <= MAX_FILES):
              fail("Invalid file operation count.")

          run("git", "fetch", "origin", TARGET_BRANCH)

          remote_sha = run(
              "git", "rev-parse", f"origin/{TARGET_BRANCH}"
          ).stdout.strip()

          if remote_sha != base_sha:
              fail(
                  f"Remote {TARGET_BRANCH} moved. "
                  f"Expected {base_sha}, found {remote_sha}."
              )

          run("git", "reset", "--hard", f"origin/{TARGET_BRANCH}")
          run("git", "clean", "-fd")

          repo_root = Path.cwd().resolve()
          expected_paths = []
          seen = set()
          total_content_bytes = 0

          for item in files:
              if not isinstance(item, dict):
                  fail("Invalid file operation.")

              rel = item.get("path")
              action = item.get("action")

              if not isinstance(rel, str) or not rel:
                  fail("Invalid file path.")

              if "\x00" in rel or "\\" in rel:
                  fail("Unsafe file path encoding.")

              if rel in seen:
                  fail(f"Duplicate file path: {rel}")

              seen.add(rel)
              posix = PurePosixPath(rel)

              if posix.is_absolute() or ".." in posix.parts or "." in posix.parts:
                  fail(f"Unsafe file path: {rel}")

              if (
                  rel == ".git" or rel.startswith(".git/")
                  or rel == ".github" or rel.startswith(".github/")
              ):
                  fail(f"Protected path is not allowed: {rel}")

              target = (repo_root / Path(*posix.parts)).resolve()

              try:
                  target.relative_to(repo_root)
              except ValueError:
                  fail(f"Path escapes repository: {rel}")

              expected_paths.append(rel)

              if action == "write":
                  content_b64 = item.get("content_b64")
                  expected_sha256 = item.get("sha256")

                  if (
                      not isinstance(content_b64, str)
                      or not isinstance(expected_sha256, str)
                      or not re.fullmatch(r"[0-9a-f]{64}", expected_sha256)
                  ):
                      fail(f"Missing or invalid content/hash for {rel}")

                  try:
                      content = base64.b64decode(content_b64, validate=True)
                  except Exception:
                      fail(f"Invalid content encoding for {rel}")

                  if len(content) > MAX_FILE_BYTES:
                      fail(f"File too large: {rel}")

                  total_content_bytes += len(content)

                  if total_content_bytes > MAX_TOTAL_FILE_BYTES:
                      fail("Total file content exceeds limit.")

                  actual_sha256 = hashlib.sha256(content).hexdigest()
                  if actual_sha256 != expected_sha256:
                      fail(f"SHA-256 mismatch for {rel}")

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)

              elif action == "delete":
                  if target.exists():
                      if target.is_dir():
                          fail(f"Refusing directory deletion: {rel}")
                      target.unlink()
              else:
                  fail(f"Unsupported action for {rel}: {action}")

          changed = set(
              line.strip()
              for line in run("git", "diff", "--name-only").stdout.splitlines()
              if line.strip()
          )

          untracked = set(
              line.strip()
              for line in run(
                  "git", "ls-files", "--others", "--exclude-standard"
              ).stdout.splitlines()
              if line.strip()
          )

          expected_set = set(expected_paths)
          actual_paths = changed | untracked

          if actual_paths != expected_set:
              fail(
                  f"Changed-file set mismatch. "
                  f"Expected {sorted(expected_set)}, got {sorted(actual_paths)}."
              )

          run("git", "diff", "--check")

          if not shutil.which("node"):
              fail("Node.js is unavailable on the runner.")

          source_files = sorted(
              p for p in repo_root.rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and "node_modules" not in p.parts
              and p.suffix in {".js", ".mjs", ".cjs"}
          )

          for path in source_files:
              run("node", "--check", str(path.relative_to(repo_root)))

          json_files = sorted(
              p for p in repo_root.rglob("*.json")
              if ".git" not in p.parts and "node_modules" not in p.parts
          )

          for path in json_files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  fail(f"Invalid JSON in {path.relative_to(repo_root)}: {exc}")

          test_files = sorted(
              p for p in repo_root.rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and "node_modules" not in p.parts
              and (
                  p.name.endswith(".test.js")
                  or p.name.endswith(".test.mjs")
                  or p.name.endswith(".test.cjs")
              )
          )

          tests_status = "NOT_FOUND"

          if test_files:
              clean_env = {
                  "PATH": os.environ.get("PATH", ""),
                  "HOME": os.environ.get("HOME", ""),
                  "CI": "true",
              }

              result = run(
                  "node",
                  "--test",
                  *[str(p.relative_to(repo_root)) for p in test_files],
                  env=clean_env,
                  timeout=TEST_TIMEOUT_SECONDS,
              )

              if result.stdout:
                  print(result.stdout)

              tests_status = "PASS"

          run("git", "config", "user.name", "Farm-Spiel Ticket Installer")
          run(
              "git",
              "config",
              "user.email",
              "farm-spiel-installer@users.noreply.github.com",
          )

          run("git", "add", "-A", "--", *sorted(expected_set))

          staged = set(
              line.strip()
              for line in run(
                  "git", "diff", "--cached", "--name-only"
              ).stdout.splitlines()
              if line.strip()
          )

          if staged != expected_set:
              fail("Staged-file set mismatch.")

          run("git", "commit", "-m", commit_message)

          result_sha = run("git", "rev-parse", "HEAD").stdout.strip()
          parent_sha = run("git", "rev-parse", "HEAD^").stdout.strip()

          if parent_sha != base_sha:
              fail("Commit parent mismatch.")

          committed_paths = set(
              line.strip()
              for line in run(
                  "git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"
              ).stdout.splitlines()
              if line.strip()
          )

          if committed_paths != expected_set:
              fail("Committed-file set mismatch.")

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write(f"ticket={ticket}\n")
                  output.write(f"result_sha={result_sha}\n")
                  output.write(f"payload_sha256={payload_sha256}\n")
                  output.write(f"tests={tests_status}\n")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Farm-Spiel installer preflight\n\n")
                  summary.write(f"- Ticket: `{ticket}`\n")
                  summary.write(f"- Base-SHA: `{base_sha}`\n")
                  summary.write(f"- Prepared result-SHA: `{result_sha}`\n")
                  summary.write(f"- Payload SHA-256: `{payload_sha256}`\n")
                  summary.write(f"- Automated Node tests: `{tests_status}`\n")
                  summary.write("- Changed files:\n")
                  for rel in sorted(expected_set):
                      summary.write(f"  - `{rel}`\n")

          print(f"READY_TO_PUSH {ticket} {result_sha}")
          PY

      - name: Push verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA: ${{ steps.prepare.outputs.result_sha }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RESULT_SHA"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin "${RESULT_SHA}:refs/heads/develop"

          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin develop

          VERIFY_SHA="$(git rev-parse origin/develop)"

          if [ "$VERIFY_SHA" != "$RESULT_SHA" ]; then
            echo "Push verification failed." >&2
            exit 1
          fi

          {
            echo
            echo "## Push"
            echo
            echo "- develop: \`$VERIFY_SHA\`"
            echo "- Status: \`READY_FOR_REVIEW\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report successful issue ticket
    needs: install
    if: >-
      needs.install.result == 'success' &&
      github.event_name == 'issues' &&
      github.actor == 'neidelbert' &&
      github.event.issue.user.login == 'neidelbert' &&
      github.event.issue.author_association == 'OWNER'

    permissions:
      issues: write

    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Comment result and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_SHA: ${{ needs.install.outputs.result_sha }}
          TICKET: ${{ needs.install.outputs.ticket }}
          TESTS: ${{ needs.install.outputs.tests }}
        shell: bash
        run: |
          set -euo pipefail

          BODY="$(printf 'â %s installed.\n\nResult-SHA: `%s`\n\nAutomated Node tests: `%s`\n\nStatus: `READY_FOR_REVIEW`' "$TICKET" "$RESULT_SHA" "$TESTS")"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f "body=${BODY}"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=closed